name: Clone & Merge M3U with group-title per file

on:
  schedule:
    - cron: '0 * * * *'  # প্রতি ১ ঘণ্টায় রান
  workflow_dispatch:

jobs:
  clone-and-merge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout this workflow repo
      uses: actions/checkout@v3

    - name: Clone IPTV-Scraper-Zilla repo
      run: |
        git clone https://github.com/abusaeeidx/IPTV-Scraper-Zilla.git

    - name: Merge all .m3u with group-title set from cloned repo
      run: |
        mkdir -p merged_tmp
        echo "#EXTM3U" > merged_tmp/merged.m3u

        find IPTV-Scraper-Zilla -type f -name "*.m3u" ! -name "merged.m3u" | while read file; do
          base=$(basename "$file" .m3u)
          awk -v grp="$base" '
            /^#EXTM3U/ { next }
            /^#EXTINF/ {
              if ($0 ~ /group-title="/) {
                sub(/group-title="[^"]*"/, "group-title=\"" grp "\"")
              } else {
                sub(/#EXTINF:/, "#EXTINF:-1 group-title=\"" grp "\",")
              }
              print
              getline
              print
              next
            }
            { print }
          ' "$file" >> merged_tmp/merged.m3u
        done

        mv merged_tmp/merged.m3u merged.m3u
        rm -rf merged_tmp

    - name: Commit and push merged playlist to this repo
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add merged.m3u
        if ! git diff --cached --quiet; then
          MSG="Auto-merged m3u playlists from IPTV-Scraper-Zilla $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$MSG"
          git push
        else
          echo "No changes to commit"
        fi
