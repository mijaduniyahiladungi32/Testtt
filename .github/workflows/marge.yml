name: Merge M3U with group-title per file

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  merge-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v3
      with:
        repository: abusaeeidx/IPTV-Scraper-Zilla
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: false

    - name: Merge all .m3u with group-title set
      run: |
        mkdir -p merged_tmp
        echo -n > merged_tmp/merged.m3u

        find . -type f -name "*.m3u" ! -path "./merged_tmp/*" ! -name "merged.m3u" | while read file; do
          base=$(basename "$file" .m3u)
          awk -v grp="$base" '
            /^#EXTINF/ {
              if ($0 ~ /group-title="/) {
                sub(/group-title="[^"]*"/, "group-title=\"" grp "\"")
              } else {
                sub(/#EXTINF:/, "#EXTINF:-1 group-title=\"" grp "\",")
              }
              print
              getline
              print
              next
            }
            { print }
          ' "$file" >> merged_tmp/merged.m3u
        done

        sed -i '1i #EXTM3U' merged_tmp/merged.m3u
        mv merged_tmp/merged.m3u merged.m3u
        rm -rf merged_tmp

    - name: Commit and push merged playlist
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add merged.m3u
        if ! git diff --cached --quiet; then
          git commit -m "Auto-merged m3u playlists with group-title $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push
        else
          echo "No changes to commit"
        fi
