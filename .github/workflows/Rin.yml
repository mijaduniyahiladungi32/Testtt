name: Run BeeSport Spider

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # Runs every 30 minutes

jobs:
  run-spider:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run BeeSport Spider
        run: |
          python live_beesport.py > BeeSport.m3u

      - name: Commit and Push BeeSport.m3u
        run: |
          git config --global user.name "BeeSportBot"
          git config --global user.email "actions@github.com"
          git add BeeSport.m3u
          git commit -m "Update BeeSport.m3u" || echo "No changes to commit"
          git push
