name: Unzip and Push

on:
  workflow_dispatch:

jobs:
  unzip_and_push:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 🟢 REQUIRED TO ALLOW PUSH

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show before unzip
        run: ls -la

      - name: Unzip in-place (overwrite silently)
        run: unzip -o freeiptv-master.zip -d .

      - name: Check file tree
        run: ls -laR

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Force add everything
        run: git add --all

      - name: Commit and Push
        run: |
          if git diff --cached --quiet; then
            echo "❌ No changes to commit"
          else
            git commit -m "✅ Auto unzip: freeiptv-master.zip"
            git push
          fi
