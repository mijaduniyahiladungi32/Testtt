name: Unzip and Push

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write  # 🟢 Needed to push workflow YAML files

jobs:
  unzip_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show files before unzip
        run: ls -la

      - name: Unzip freeiptv-master.zip into root
        run: unzip -o freeiptv-master.zip -d .

      - name: Show files after unzip
        run: ls -laR

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add all files including workflow updates
        run: git add --all

      - name: Commit and Push
        run: |
          if git diff --cached --quiet; then
            echo "✅ Nothing to commit"
          else
            git commit -m "✅ Auto unzip and push: freeiptv-master.zip"
            git push
          fi
