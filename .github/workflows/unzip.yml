name: Unzip and Push

on:
  workflow_dispatch:

permissions:            # <-- এখানে টপ-লেভেলে, `on:` এর সাথে সমান লেভেলে
  contents: write
  workflows: write

jobs:
  unzip_and_push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o freeiptv-master.zip -d .

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unzipped freeiptv-master.zip"
          fi

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push
